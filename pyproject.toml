[project]
name = "bucketio"
version = "0.1.0"
description = "Local, self-hosted contact store that sits in front of Treg and learns company email formats"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "BucketIO" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "Unidecode>=1.3",
    "dnspython>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
laya = ["laya[serve]>=0.3.20"]
dev = ["pytest>=8.3", "respx>=0.21"]

[project.scripts]
bucketio = "bucketio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bucketio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true

# Vercel auto-detects the FastAPI app from the `fastapi` dependency, but the app
# does not live at one of its default entrypoints, so point it at the real module.
# The FastAPI preset serves the whole app as one function and promotes the
# `bucketio/web` StaticFiles mount (registered after every /api route) to the CDN.
[tool.vercel]
entrypoint = "bucketio.api:app"
